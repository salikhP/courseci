name: courseci-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: courseci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: courseci
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d courseci"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
