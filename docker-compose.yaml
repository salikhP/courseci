name: courseci-local

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${COURSECI_API_PORT:-8000}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${COURSECI_DB_DATABASE:-courseci}
      DB_USERNAME: ${COURSECI_DB_USERNAME:-postgres}
      DB_PASSWORD: ${COURSECI_DB_PASSWORD:-courseci}
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
    ports:
      - "${COURSECI_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - courseci
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - '$$socket = @fsockopen("127.0.0.1", 8000); if (! $$socket) { exit(1); } fclose($$socket);'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${COURSECI_DB_DATABASE:-courseci}
      POSTGRES_USER: ${COURSECI_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${COURSECI_DB_PASSWORD:-courseci}
    ports:
      - "${COURSECI_DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - courseci

volumes:
  postgres_data:

networks:
  courseci:
    driver: bridge
